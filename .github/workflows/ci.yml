name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Metric tests (and committed data matches the pipeline)
        run: pytest -v
      - name: Rebuild metrics.json
        run: |
          python -m pipeline.metrics
          git diff --exit-code data/metrics.json
